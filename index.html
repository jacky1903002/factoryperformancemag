<!DOCTYPE html>
<html lang="zh-TW">
<head>

        .tab-active { border-bottom: 3px solid #3b82f6; color: #3b82f6; font-weight: bold; }

<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- 登入畫面 -->
    <div id="auth-screen" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">工廠績效管理系統登入</h2>
            <div id="auth-error" class="mb-4 text-red-500 text-sm text-center hidden"></div>
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">電子郵件</label>
                    <input type="email" id="auth-email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">密碼</label>
                    <input type="password" id="auth-password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div class="flex items-center justify-between text-sm">
                    <button type="button" id="toggle-auth-mode" class="text-blue-600 hover:underline">切換為註冊帳號</button>
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition font-medium">登入</button>
            </form>
        </div>
    </div>

    <!-- 主應用程式介面 -->
    <div id="app-screen" class="hidden flex-1 flex flex-col">
        <!-- 頂部導覽列 -->
        <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <h1 class="text-xl font-bold text-gray-800">🏭 工廠個人績效分析系統</h1>
                <div id="connection-status" class="flex items-center space-x-2 px-3 py-1 bg-yellow-100 text-yellow-800 rounded-full text-xs font-semibold">
                    <span class="w-2 h-2 bg-yellow-500 rounded-full animate-pulse"></span>
                    <span id="status-text">連線同步中...</span>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <span id="user-email-display" class="text-sm text-gray-600"></span>
                <button id="logout-btn" class="bg-red-500 text-white px-3 py-1.5 rounded text-sm hover:bg-red-600 transition">登出</button>
            </div>
        </header>

        <!-- 工具列 -->
        <div class="bg-white border-b px-6 py-2 flex justify-between items-center text-sm">
            <div class="flex space-x-2">
                <button onclick="exportToExcel()" class="bg-green-600 text-white px-3 py-1.5 rounded hover:bg-green-700 transition flex items-center space-x-1">
                    <span>📥 匯出 Excel</span>
                </button>
                <label class="bg-blue-600 text-white px-3 py-1.5 rounded hover:bg-blue-700 transition cursor-pointer flex items-center space-x-1">
                    <span>📤 匯入 Excel</span>
                    <input type="file" id="excel-file-input" accept=".xlsx, .xls" class="hidden" onchange="importFromExcel(event)">
                </label>
            </div>
            <div class="text-xs text-gray-500">
                提示：在任意工作表頁籤上「雙擊滑鼠」即可直接更改名稱！
            </div>
        </div>

        <!-- 頁籤導覽 -->
        <nav id="tabs-nav" class="bg-white border-b px-6 flex space-x-6 overflow-x-auto">
            <button class="tab-btn py-3 px-2 text-sm font-medium tab-active" data-target="sheet1" id="btn-sheet1">1. 加班配合度</button>
            <button class="tab-btn py-3 px-2 text-sm font-medium text-gray-500 hover:text-gray-700" data-target="sheet2" id="btn-sheet2">2. 月競賽</button>
            <button class="tab-btn py-3 px-2 text-sm font-medium text-gray-500 hover:text-gray-700" data-target="sheet3" id="btn-sheet3">3. 品質改善</button>

        </nav>

        <!-- 內容主體區 -->
        <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
            <div id="sheet-container"></div>
            
            <!-- 工作表 7: 視覺圖表 -->
            <div id="sheet7-container" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-lg shadow">
                    <div class="flex justify-between items-center mb-4">
                        <h2 id="sheet7-title" class="text-lg font-bold">7. 排行視覺圖表</h2>
                        <button onclick="exportChartImage()" class="bg-purple-600 text-white px-3 py-1.5 rounded text-sm hover:bg-purple-700 transition">📊 匯出目前圖表</button>
                    </div>
                    <div class="mb-4 flex flex-wrap gap-4 items-center">
                        <div>
                            <label class="text-sm font-medium text-gray-700 mr-2">選擇部門檢視：</label>
                            <select id="chart-dept-select" onchange="renderCharts()" class="px-3 py-1 border rounded-md text-sm">
                                <option value="all">全體人員總覽</option>
                            </select>
                        </div>
                    </div>
                    <div class="w-full h-96">
                        <canvas id="rankingChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 工作表 8: 排行表格分析 -->
            <div id="sheet8-container" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-lg shadow">
                    <div class="flex justify-between items-center mb-4">
                        <h2 id="sheet8-title" class="text-lg font-bold">8. 排行表格分析</h2>
                        <button onclick="exportSheet8Excel()" class="bg-green-600 text-white px-3 py-1.5 rounded text-sm hover:bg-green-700 transition">📥 匯出此分析表格</button>
                    </div>
                    <div class="mb-4 flex flex-wrap gap-4 items-center">
                        <div>

                    </div>

                        <!-- 動態填入表格 -->

        </main>

        document.addEventListener('DOMContentLoaded', () => {
            ['sheet1', 'sheet2', 'sheet3', 'sheet4', 'sheet5', 'sheet6', 'sheet7', 'sheet8'].forEach(key => {
                const btn = document.getElementById(`btn-${key}`);
                if (btn) {
                    btn.addEventListener('click', () => switchTab(key));
                    btn.addEventListener('dblclick', (e) => {
                        e.preventDefault();
                        renameTab(key);
                    });
                }
            });
        });

        auth.onAuthStateChanged(user => {
            const statusIndicator = document.getElementById('connection-status');
            const statusText = document.getElementById('status-text');
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('user-email-display').textContent = user.email;
                
                const dbRef = db.ref(`users/${user.uid}/performanceData`);
                
                db.ref('.info/connected').on('value', snap => {
                    if (snap.val() === true) {
                        statusIndicator.className = "flex items-center space-x-2 px-3 py-1 bg-green-100 text-green-800 rounded-full text-xs font-semibold";
                        statusText.textContent = "雲端已連線";
                    } else {
                        statusIndicator.className = "flex items-center space-x-2 px-3 py-1 bg-red-100 text-red-800 rounded-full text-xs font-semibold";
                        statusText.textContent = "連線中斷";
                    }
                });

                dbRef.on('value', snapshot => {
                    const data = snapshot.val();
                    if (data) {
                        appData = { ...appData, ...data };
                    } else {
                        dbRef.set(appData);
                    }
                    processFormulasAndScores();
                    updateTabNamesUI();
                    renderActiveTab();
                });
            } else {
                currentUser = null;
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        });

        document.getElementById('auth-form').addEventListener('submit', e => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errDiv = document.getElementById('auth-error');
            errDiv.classList.add('hidden');

            if (isSignUp) {
                auth.createUserWithEmailAndPassword(email, password).catch(err => {
                    errDiv.textContent = err.message;
                    errDiv.classList.remove('hidden');
                });
            } else {
                auth.signInWithEmailAndPassword(email, password).catch(err => {
                    errDiv.textContent = "登入失敗：" + err.message;
                    errDiv.classList.remove('hidden');
                });
            }
        });

        function renameTab(sheetKey) {
            let currentTitle = appData[sheetKey].title;
            let newTitle = prompt("請輸入新的工作表名稱：", currentTitle);
            if (newTitle && newTitle.trim() !== "") {
                appData[sheetKey].title = newTitle.trim();
                saveData();
                updateTabNamesUI();
                renderActiveTab();
            }
        }

        function updateTabNamesUI() {
            ['sheet1', 'sheet2', 'sheet3', 'sheet4', 'sheet5', 'sheet6', 'sheet7', 'sheet8'].forEach(key => {
                let btn = document.getElementById(`btn-${key}`);
                if (btn && appData[key]) {
                    btn.textContent = appData[key].title;
                }
            });
        }

        function switchTab(tabId) {
            activeTab = tabId;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.target === tabId) {
                    btn.classList.add('tab-active');
                    btn.classList.remove('text-gray-500');
                } else {
                    btn.classList.remove('tab-active');
                    btn.classList.add('text-gray-500');
                }
            });

            document.getElementById('sheet-container').classList.add('hidden');
            document.getElementById('sheet7-container').classList.add('hidden');
            document.getElementById('sheet8-container').classList.add('hidden');

            if (tabId === 'sheet7') {
                document.getElementById('sheet7-container').classList.remove('hidden');
                document.getElementById('sheet7-title').textContent = appData.sheet7.title;
                updateDeptSelectOptions();
                renderCharts();
            } else if (tabId === 'sheet8') {
                document.getElementById('sheet8-container').classList.remove('hidden');
                document.getElementById('sheet8-title').textContent = appData.sheet8.title;
                updateTableDeptSelectOptions();
                renderSheet8Table();
            } else {
                document.getElementById('sheet-container').classList.remove('hidden');
                if (tabId === 'sheet6') {
                    processFormulasAndScores();
                }
                renderActiveTab();
            }
        }

        function saveData() {
            if (!currentUser) return;
            db.ref(`users/${currentUser.uid}/performanceData`).set(appData);
        }

        function processFormulasAndScores() {
            if (appData.sheet1) {
                appData.sheet1.rows.forEach(r => {
                    let weekday = Number(r[3]) || 0;
                    let restday = Number(r[4]) || 0;
                    let months = Number(r[5]) || 6;
                    let total = weekday + restday;
                    let avg = months > 0 ? Number((total / months).toFixed(2)) : 0;
                    
                    r[6] = total;
                    r[7] = avg;

                    let score = "";
                    if (avg > 40 && avg <= 46) score = 10;
                    else if (avg >= 30 && avg <= 40) score = 5;
                    else if (avg >= 21 && avg < 30) score = -5;
                    else if (avg < 21 && (r[3] !== "" || r[4] !== "")) score = -20;
                    r[8] = score;
                });
            }

            if (appData.sheet2) {
                appData.sheet2.rows.forEach(r => {
                    let note = r[4] || r[3] || "";
                    let pts = 0;
                    if (note.includes("優勝")) pts = 10;
                    else if (note.includes("入選")) pts = 5;
                    r[3] = pts !== 0 ? pts : "";
                });
            }

            if (appData.sheet3) {
                appData.sheet3.rows.forEach(r => {
                    let note = r[4] || r[3] || "";
                    let pts = 0;
                    if (note.includes("品質改善")) pts = 3;
                    r[3] = pts !== 0 ? pts : "";
                });
            }

            if (appData.sheet4) {
                appData.sheet4.rows.forEach(r => {
                    let note = r[4] || r[3] || "";
                    let pts = 0;
                    if (note.includes("大功")) pts = 20;
                    else if (note.includes("小功")) pts = 10;
                    else if (note.includes("嘉獎")) pts = 5;
                    else if (note.includes("大過")) pts = -20;
                    else if (note.includes("小過")) pts = -10;
                    else if (note.includes("申誡")) pts = -5;
                    r[3] = pts !== 0 ? pts : "";
                });
            }

            if (appData.sheet5) {
                appData.sheet5.rows.forEach(r => {
                    let note = r[4] || r[3] || "";
                    let pts = 0;
                    if (note.includes("A級支援")) pts = 10;
                    else if (note.includes("B級支援")) pts = 5;
                    else if (note.includes("C級支援")) pts = 3;
                    r[3] = pts !== 0 ? pts : "";
                });
            }

            let employeeMap = {};
            if (appData.sheet1) {
                appData.sheet1.rows.forEach(r => {
                    let key = `${r[1]}_${r[2]}`;
                    employeeMap[key] = {
                        dept: r[0], id: r[1], name: r[2],
                        s1: Number(r[8]) || 0, s2: 0, s3: 0, s5: 0, s4: 0, total: 0
                    };
                });
            }

            if (appData.sheet2) {
                appData.sheet2.rows.forEach(r => {
                    let key = `${r[1]}_${r[2]}`;
                    if (employeeMap[key]) employeeMap[key].s2 = Number(r[3]) || 0;
                });
            }
            if (appData.sheet3) {
                appData.sheet3.rows.forEach(r => {
                    let key = `${r[1]}_${r[2]}`;
                    if (employeeMap[key]) employeeMap[key].s3 = Number(r[3]) || 0;
                });
            }
            if (appData.sheet5) {
                appData.sheet5.rows.forEach(r => {
                    let key = `${r[1]}_${r[2]}`;
                    if (employeeMap[key]) employeeMap[key].s5 = Number(r[3]) || 0;
                });
            }
            if (appData.sheet4) {
                appData.sheet4.rows.forEach(r => {
                    let key = `${r[1]}_${r[2]}`;
                    if (employeeMap[key]) employeeMap[key].s4 = Number(r[3]) || 0;
                });
            }

            let empList = Object.values(employeeMap);
            empList.forEach(emp => {
                emp.total = emp.s1 + emp.s2 + emp.s3 + emp.s5 + emp.s4;
            });

            // 由高到低排序
            let sortedList = [...empList].sort((a, b) => b.total - a.total);

            appData.sheet6.rows = empList.map(emp => {
                let rank = sortedList.findIndex(e => e.id === emp.id && e.name === emp.name) + 1;
                return [
                    emp.dept, emp.id, emp.name,
                    emp.s1, emp.s2, emp.s3, emp.s5, emp.s4,
                    emp.total, rank
                ];
            });
        }

        function renderActiveTab() {
            if (!activeTab.startsWith('sheet') || activeTab === 'sheet7' || activeTab === 'sheet8') return;
            
            if (activeTab === 'sheet6') {
                processFormulasAndScores();
            }

            const sheet = appData[activeTab];
            const container = document.getElementById('sheet-container');

            let readOnlyCols = [];
            if (activeTab === 'sheet1') readOnlyCols = [6, 7, 8];
            if (activeTab === 'sheet2' || activeTab === 'sheet3' || activeTab === 'sheet5') readOnlyCols = [3];
            if (activeTab === 'sheet4') readOnlyCols = [3];

            let html = `
                <div class="bg-white p-6 rounded-lg shadow">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-gray-800">${sheet.title}</h2>
                        ${activeTab !== 'sheet6' ? `<button onclick="addRow('${activeTab}')" class="bg-blue-500 text-white px-3 py-1.5 rounded text-sm hover:bg-blue-600 transition">+ 新增資料列</button>` : `<span class="text-xs text-gray-500">此工作表由工作表1~5自動彙整計算與排名</span>`}
                    </div>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200 border">
                            <thead class="bg-gray-100">
                                <tr>
                                    ${activeTab !== 'sheet6' ? `<th class="px-3 py-2 text-center text-xs font-medium text-gray-500 uppercase w-16">刪除</th>` : ''}
                                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase w-12">序</th>
                                    ${sheet.columns.map(col => `
                                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-700 uppercase">
                                            ${col}
                                        </th>
                                    `).join('')}
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                ${sheet.rows.map((row, rIdx) => `
                                    <tr class="hover:bg-gray-50">
                                        ${activeTab !== 'sheet6' ? `
                                            <td class="px-3 py-2 text-center">
                                                <button onclick="deleteRow('${activeTab}', ${rIdx})" class="text-red-500 hover:text-red-700 font-bold px-1.5 py-0.5 rounded border border-red-200 bg-red-50 text-xs">刪除</button>
                                            </td>
                                        ` : ''}
                                        <td class="px-4 py-2 text-sm text-gray-400">${rIdx + 1}</td>${row.map((cell, cIdx) => {
                                            let isRO = (activeTab === 'sheet6') || readOnlyCols.includes(cIdx);
                                            return `
                                                <td class="px-4 py-2 text-sm text-gray-700 ${isRO ? 'bg-gray-50 text-gray-500 font-medium' : ''}" 
                                                    ${!isRO ? `contenteditable="true" onblur="updateCell('${activeTab}', ${rIdx},${cIdx}, this)"` : ''}>
                                                    ${cell}
                                                </td>
                                            `;
                                        }).join('')}
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function updateCell(sheetKey, rIdx, cIdx, el) {
            appData[sheetKey].rows[rIdx][cIdx] = el.innerText.trim();
            processFormulasAndScores();
            saveData();
        }

        function addRow(sheetKey) {
            const colCount = appData[sheetKey].columns.length;
            const newRow = new Array(colCount).fill("");
            appData[sheetKey].rows.push(newRow);
            saveData();
            renderActiveTab();
        }

        function deleteRow(sheetKey, rIdx) {
            if (confirm("確定要刪除此筆資料嗎？")) {
                appData[sheetKey].rows.splice(rIdx, 1);
                saveData();
                renderActiveTab();
            }
        }

        let rankingChartInstance = null;

        function updateDeptSelectOptions() {
            processFormulasAndScores();
            const selectEl = document.getElementById('chart-dept-select');
            let depts = new Set();
            if (appData.sheet6 && appData.sheet6.rows) {
                appData.sheet6.rows.forEach(r => {
                    if (r[0]) depts.add(r[0]);
                });
            }
            
            let currentVal = selectEl.value;
            let optionsHtml = `<option value="all">全體人員總覽</option>`;
            depts.forEach(dept => {
                optionsHtml += `<option value="${dept}">${dept} 人員排行</option>`;
            });
            selectEl.innerHTML = optionsHtml;
            selectEl.value = depts.has(currentVal) || currentVal === 'all' ? currentVal : 'all';
        }

        function updateTableDeptSelectOptions() {
            processFormulasAndScores();
            const selectEl = document.getElementById('table-dept-select');
            let depts = new Set();
            if (appData.sheet6 && appData.sheet6.rows) {
                appData.sheet6.rows.forEach(r => {
                    if (r[0]) depts.add(r[0]);
                });
            }
            
            let currentVal = selectEl.value;
            let optionsHtml = `<option value="all">全體人員總覽</option>`;
            depts.forEach(dept => {
                optionsHtml += `<option value="${dept}">${dept} 人員排行</option>`;
            });
            selectEl.innerHTML = optionsHtml;
            selectEl.value = depts.has(currentVal) || currentVal === 'all' ? currentVal : 'all';
        }

        function renderCharts() {
            processFormulasAndScores();
            const selectedDept = document.getElementById('chart-dept-select').value;
            let rows = [...(appData.sheet6.rows || [])];

            if (selectedDept !== 'all') {
                rows = rows.filter(r => r[0] === selectedDept);
            }

            // 依分數由高到低排序 (欄位 8 為總分)
            rows.sort((a, b) => Number(b[8]) - Number(a[8]));

            const labels = rows.map(r => `${r[2]} (${r[1]}) - ${r[0]}`);
            const data = rows.map(r => Number(r[8]) || 0);

            const ctx = document.getElementById('rankingChart').getContext('2d');
            if (rankingChartInstance) rankingChartInstance.destroy();

            rankingChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels.length ? labels : ['無資料'],
                    datasets: [{
                        label: selectedDept === 'all' ? '全廠人員總分排行 (由高到低)' : `${selectedDept} 人員總分排行 (由高到低)`,
                        data: data.length ? data : [0],
                        backgroundColor: 'rgba(59, 130, 246, 0.6)',
                        borderColor: 'rgba(59, 130, 246, 1)',
                        borderWidth: 1
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        function renderSheet8Table() {
            processFormulasAndScores();
            const selectedDept = document.getElementById('table-dept-select').value;
            let rows = [...(appData.sheet6.rows || [])];

            if (selectedDept !== 'all') {
                rows = rows.filter(r => r[0] === selectedDept);
            }

            // 依分數由高到低排序
            rows.sort((a, b) => Number(b[8]) - Number(a[8]));

            const wrapper = document.getElementById('sheet8-table-wrapper');
            let columns = ["部門名稱", "工號", "中文名", "加班配合度", "月競賽", "品質改善", "支援", "獎懲紀錄", "總分", "新排名"];

            let html = `
                <table class="min-w-full divide-y divide-gray-200 border" id="sheet8-export-table">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase w-12">名次</th>
                            ${appData.sheet6.columns.map(col => `<th class="px-4 py-2 text-left text-xs font-medium text-gray-700 uppercase">${col}</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        ${rows.map((row, idx) => `
                            <tr class="hover:bg-gray-50">
                                <td class="px-4 py-2 text-sm font-bold text-blue-600">${idx + 1}</td>${row.map(cell => `<td class="px-4 py-2 text-sm text-gray-700">${cell}</td>`).join('')}
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            wrapper.innerHTML = html;
        }

        function exportChartImage() {
            if (!rankingChartInstance) {
                alert("目前尚無圖表可供匯出！");
                return;
            }
            const imageURL = rankingChartInstance.toBase64Image();
            const link = document.createElement('a');
            link.href = imageURL;
            link.download = `排行視覺圖表_${document.getElementById('chart-dept-select').value}.png`;
            link.click();
        }

        function exportSheet8Excel() {
            const selectedDept = document.getElementById('table-dept-select').value;
            let rows = [...(appData.sheet6.rows || [])];
            if (selectedDept !== 'all') {
                rows = rows.filter(r => r[0] === selectedDept);
            }
            rows.sort((a, b) => Number(b[8]) - Number(a[8]));

            const exportRows = rows.map((r, idx) => [idx + 1, ...r]);
            const wsData = [["名次", ...appData.sheet6.columns], ...exportRows];
            const ws = XLSX.utils.aoa_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "排行表格分析");
            XLSX.writeFile(wb, `排行表格分析_${selectedDept}.xlsx`);
        }

        function exportToExcel() {
            processFormulasAndScores();
            const wb = XLSX.utils.book_new();
            ['sheet1', 'sheet2', 'sheet3', 'sheet4', 'sheet5', 'sheet6'].forEach(key => {
                const sheet = appData[key];
                const wsData = [sheet.columns, ...sheet.rows];
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                XLSX.utils.book_append_sheet(wb, ws, sheet.title.substring(0, 30));
            });
            XLSX.writeFile(wb, "工廠個人績效分析報表.xlsx");
        }

        function importFromExcel(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                
                let sKeys = ['sheet1', 'sheet2', 'sheet3', 'sheet4', 'sheet5', 'sheet6'];
                workbook.SheetNames.forEach((sheetName, idx) => {
                    if (idx < sKeys.length) {
                        const ws = workbook.Sheets[sheetName];
                        const json = XLSX.utils.sheet_to_json(ws, { header: 1 });
                        if (json.length > 0) {
                            appData[sKeys[idx]].columns = json[0];
                            appData[sKeys[idx]].rows = json.slice(1).filter(r => r.length > 0);
                        }
                    }
                });
                processFormulasAndScores();
                saveData();
                renderActiveTab();
                alert("Excel 資料匯入成功並已同步至雲端！");
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
